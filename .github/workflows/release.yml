name: Release Build & Provenance

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build, Sign & Attest APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Decode Ephemeral Keystore
        id: decode_keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Securely Cleanup Keystore
        if: always()
        run: |
          if [ -n "$RUNNER_TEMP" ] && [ -f "$RUNNER_TEMP/keystore.jks" ]; then
            shred -u -z "$RUNNER_TEMP/keystore.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/keystore.jks"
            echo "Ephemeral keystore securely destroyed."
          fi

      - name: Prepare Named Release APK
        id: prepare_apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "Error: No release APK generated!"
            exit 1
          fi
          ORIGINAL_VERSION="v1.3"
          TAG_NAME="${{ github.ref_name }}"
          DEST_NAME="flappybird-restored-${ORIGINAL_VERSION}-${TAG_NAME}.apk"
          DEST_PATH="app/build/outputs/apk/release/${DEST_NAME}"
          if [ "$RAW_APK" != "$DEST_PATH" ]; then
            mv "$RAW_APK" "$DEST_PATH"
          fi
          echo "apk_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$DEST_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release APK: $DEST_NAME"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
